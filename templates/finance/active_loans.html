{% extends 'base.html' %}

{% block content %}

<h2>My Loans</h2>

<table class="table table-striped">

    <thead>

        <tr>
            <th>Loan Amount</th>
            <th>Remaining Balance</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

    </thead>

    <tbody>

    {% for loan in loans %}

        <tr>

            <td>{{ loan.requested_amount }} RWF</td>

            <td>{{ loan.remaining_balance }} RWF</td>

            <td>{{ loan.status }}</td>

            <td>

                <a href="{% url 'make_repayment' loan.id %}"
                   class="btn btn-success btn-sm">

                    Make Repayment

                </a>

            </td>

        </tr>

    {% empty %}

        <tr>

            <td colspan="4">
                No loans found.
            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
