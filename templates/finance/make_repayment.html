{% extends 'base.html' %}

{% block content %}

<h2>Loan Repayment</h2>

<p>
    Remaining Balance:
    <strong>
        {{ loan.remaining_balance }}
    </strong>
</p>

<form method="POST"
      enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit"
            class="btn btn-success">

        Submit Repayment

    </button>

</form>

{% endblock %}
