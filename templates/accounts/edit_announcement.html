{% extends 'base.html' %}

{% block content %}

<div class="form-card">

    <h2>Edit Announcement</h2>

    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-3">

            <label>Title</label>

            <input type="text"
                   name="title"
                   class="form-control"
                   value="{{ announcement.title }}">

        </div>

        <div class="mb-3">

            <label>Description</label>

            <textarea name="description"
                      class="form-control"
                      rows="6">{{ announcement.description }}</textarea>

        </div>

        <div class="mb-3">

            <label>Image</label>

            <input type="file"
                   name="image"
                   class="form-control">

        </div>

        <button class="btn btn-success">
            Update Announcement
        </button>

    </form>

</div>

{% endblock %}
