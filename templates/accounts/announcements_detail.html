{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="card shadow-sm">

        {% if announcement.image %}

        <img
            src="{{ announcement.image.url }}"
            class="card-img-top">

        {% endif %}

        <div class="card-body">

            <h2>
                {{ announcement.title }}
            </h2>

            <p class="text-muted">

                {{ announcement.created_at }}

            </p>

            <hr>

            <p>

                {{ announcement.description }}

            </p>

        </div>

    </div>

</div>

{% endblock %}
