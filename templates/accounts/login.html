{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="form-card">

        <h2 class="mb-4">
            Login
        </h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                >
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
