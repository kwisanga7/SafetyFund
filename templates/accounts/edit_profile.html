{% extends 'base.html' %}

{% block content %}

<div class="form-card">

    <h2 class="mb-4">
        Edit Profile
    </h2>

    <form
        method="POST"
        enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="dashboard-btn">

            Save Changes

        </button>

    </form>

</div>

{% endblock %}
